name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Shell scripts
        run: |
          bash -n system/install.sh
          bash -n system/uninstall.sh
      - name: Extension syntax
        run: cp extension/prism-omen@local/extension.js /tmp/extension.mjs && node --check /tmp/extension.mjs
