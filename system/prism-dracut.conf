# Installed by Prism: keep the Omen driver out of the initramfs. It is listed in
# modules-load.d (it has no hardware alias), so dracut copied it into early boot,
# where its sound dependencies are missing: "Failed to start Load Kernel Modules"
# on every boot. It loads normally a second later from the real system.
omit_drivers+=" omen_rgb_keyboard "
